<!DOCTYPE html>
<html lang="en">

<head>
	<meta charset="UTF-8">
	<meta name="viewport" content="width=device-width, initial-scale=1.0">
	<!-- displays site properly based on user's device -->

	<link rel="icon" type="image/png" sizes="32x32" href="./images/favicon-32x32.png">
	<link rel="preconnect" href="https://fonts.googleapis.com">
	<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
	<link
		href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,100..900;1,9..144,100..900&family=Montserrat:ital,wght@0,100..900;1,100..900&display=swap"
		rel="stylesheet">
	<link rel="stylesheet" href="./css/styles.css">

	<title>Frontend Mentor | Product preview card component</title>
</head>

<body>
	<main class="product-card">
		<picture class="product-image">
			<source media="(width >= 750px)" srcset="./images/image-product-desktop.jpg">
			<img src="./images/image-product-mobile.jpg" alt="Perfume bottle" class="mobile-image">
		</picture>
		<section class="product-details">
			<section class="product-text">
				<p class="product-type">Perfume</p>
				<h1 class="product-name">Gabrielle Essence Eau De Parfum</h1>
				<p class="product-description">A floral, solar and voluptuous interpretation composed by Olivier Polge,
					Perfumer-Creator for the House of CHANEL.</p>
			</section>
			<section class="price">
				<span class="current-price">$149.99</span>
				<span class="original-price">$169.99</span>
			</section>
			<button class="call-to-action">Add to Cart</button>
		</section>
	</main>

	<footer class="attribution">
		Challenge by <a href="https://www.frontendmentor.io?ref=challenge">Frontend Mentor</a>.
		Coded by <a href="https://www.frontendmentor.io/profile/kkanit22">Karl Kanitsch</a>.
	</footer>
</body>

</html>
